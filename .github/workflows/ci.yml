name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}: check, lint, type-check, test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out basis-gateway
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out basis-core sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/basis-core
          path: basis-core

      - name: Install basis-core (editable)
        run: pip install -e basis-core

      - name: Install basis-gateway with dev dependencies
        run: pip install -e ".[dev]"

      - name: Install nginx (Phase 1B.2 real-NGINX producer-mTLS trust-boundary suite)
        # tests/integration/test_producer_mtls_trusted_proxy_boundary.py proves the
        # ADR-0009 trusted-proxy ingress boundary against a real nginx process --
        # this cannot be satisfied by a mock (see
        # docs/implementation/producer-mtls-phase-1b2.md). The distribution-provided
        # package (already includes ngx_http_ssl_module in Ubuntu's standard prebuilt
        # binaries) is sufficient; no build step, no container image, and no
        # additional proxy technology is introduced. If nginx is unavailable, the
        # suite skips itself with an explicit reason rather than failing CI, but
        # Phase 1B.2's trust boundary is not considered proven until this step has
        # run successfully at least once.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx

      - name: Verify nginx is available
        # Fails CI loudly here, at the point of installation, rather than
        # letting the dedicated boundary suite below silently skip itself
        # because the "nginx" executable turned out not to be on PATH.
        run: |
          command -v nginx
          nginx -v

      - name: Format check
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Producer mTLS trusted-proxy boundary suite (real NGINX, mandatory)
        # Runs tests/integration/test_producer_mtls_trusted_proxy_boundary.py
        # on its own, ahead of the full suite below, so this security-critical
        # boundary (Phase 1B.2 -- ADR-0009) is proven with real NGINX before
        # anything else in the job, and a failure here is attributable to
        # this suite specifically rather than buried in the full pytest run.
        # With nginx confirmed present above, this suite's own
        # skipif(nginx unavailable) guard never triggers here -- it always
        # executes for real in this job.
        run: pytest tests/integration/test_producer_mtls_trusted_proxy_boundary.py -v

      - name: Producer mTLS live-gateway suite (real NGINX -> real basis-gateway, mandatory)
        # Runs tests/integration/test_producer_mtls_live_gateway.py -- Phase
        # 1B.3's real-NGINX proof, distinct from the Phase 1B.2 boundary
        # suite above: this one drives the REAL basis_gateway.main:app
        # (AUTH_MODE=basis_local_token, no external OIDC issuer required)
        # behind the same real nginx + Unix-domain-socket topology, proving
        # producer mTLS is genuinely wired into the live
        # POST /v1/evaluate/operation-aware path end to end (admitted
        # producer + distinct bearer subject reaches real kernel evaluation;
        # unadmitted/malformed/zero-or-multi-SAN certificates are rejected
        # before kernel evaluation; a spoofed private header is overwritten
        # by nginx). Run on its own, ahead of the full suite below, for the
        # same attributability reason as the Phase 1B.2 step above. With
        # nginx confirmed present above, this suite's own
        # skipif(nginx unavailable) guard never triggers here -- it always
        # executes for real in this job.
        run: pytest tests/integration/test_producer_mtls_live_gateway.py -v

      - name: Tests
        run: pytest
